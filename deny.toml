# Konfigurasi cargo-deny untuk QuranRender (GPL-3.0)
# Mengacu ke docs/engineering/01_TECHNICAL_HANDOFF.md §1 dan 04_IMPLEMENTATION_PLAN.md F0-01.

[graph]
targets = [
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]

[licenses]
confidence-threshold = 0.8
allow = [
  "GPL-3.0-or-later",
  "GPL-3.0-only",
  "GPL-3.0",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "CC0-1.0",
  "OFL-1.1",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "Zlib",
  "OpenSSL",
  "MPL-2.0",
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
  { path = "LICENSE", hash = 0xbd0eed23 },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []

[advisories]
ignore = [
  "RUSTSEC-2024-0436", # paste unmaintained (dependency dari specta v2)
  "RUSTSEC-2024-0370", # proc-macro-error unmaintained (dependency dari glib-macros / wry Linux)
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
